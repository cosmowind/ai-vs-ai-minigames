<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>方块坦克竞技场 - 3D坦克大战</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div id="game-container">
        <!-- 主菜单 -->
        <div id="main-menu" class="screen active">
            <h1>方块坦克竞技场</h1>
            <div class="menu-buttons">
                <button id="start-game-btn" class="menu-btn">开始游戏</button>
                <button id="tank-workshop-btn" class="menu-btn">坦克工坊</button>
                <button id="settings-btn" class="menu-btn">设置</button>
                <button id="help-btn" class="menu-btn">帮助</button>
            </div>
        </div>

        <!-- 坦克工坊 -->
        <div id="tank-workshop" class="screen">
            <h2>坦克工坊</h2>
            <div id="workshop-container">
                <div id="tank-preview">
                    <canvas id="preview-canvas"></canvas>
                </div>
                <div id="component-panel">
                    <div class="component-section">
                        <h3>引擎</h3>
                        <div id="engine-components" class="component-grid"></div>
                    </div>
                    <div class="component-section">
                        <h3>装甲</h3>
                        <div id="armor-components" class="component-grid"></div>
                    </div>
                    <div class="stats-panel">
                        <h3>坦克属性</h3>
                        <div class="stat-item">
                            <span>速度:</span>
                            <span id="speed-stat">0</span>
                        </div>
                        <div class="stat-item">
                            <span>血量:</span>
                            <span id="health-stat">0</span>
                        </div>
                        <div class="stat-item">
                            <span>重量:</span>
                            <span id="weight-stat">0</span>
                        </div>
                    </div>
                </div>
            </div>
            <button id="save-tank-btn" class="menu-btn">保存配置</button>
            <button id="back-to-menu-btn" class="menu-btn">返回主菜单</button>
        </div>

        <!-- 游戏界面 -->
        <div id="game-screen" class="screen">
            <canvas id="game-canvas"></canvas>
            <div id="game-ui">
                <div id="health-bar">
                    <div id="health-fill"></div>
                    <span id="health-text">100/100</span>
                </div>
                <div id="speed-meter">
                    <span>速度: </span>
                    <span id="speed-value">0</span>
                </div>
                <div id="minimap">
                    <canvas id="minimap-canvas"></canvas>
                </div>
                <button id="pause-btn">暂停</button>
            </div>
        </div>

        <!-- 设置界面 -->
        <div id="settings-screen" class="screen">
            <h2>游戏设置</h2>
            <div class="settings-panel">
                <div class="setting-item">
                    <label>音效音量:</label>
                    <input type="range" id="sound-volume" min="0" max="100" value="50">
                </div>
                <div class="setting-item">
                    <label>画质:</label>
                    <select id="quality-setting">
                        <option value="low">低</option>
                        <option value="medium" selected>中</option>
                        <option value="high">高</option>
                    </select>
                </div>
                <div class="setting-item">
                    <label>鼠标灵敏度:</label>
                    <input type="range" id="mouse-sensitivity" min="1" max="10" value="5">
                </div>
            </div>
            <button id="settings-back-btn" class="menu-btn">返回</button>
        </div>

        <!-- 帮助界面 -->
        <div id="help-screen" class="screen">
            <h2>游戏帮助</h2>
            <div class="help-content">
                <h3>操作说明</h3>
                <ul>
                    <li><strong>WASD</strong> - 移动坦克</li>
                    <li><strong>鼠标</strong> - 控制视角</li>
                    <li><strong>空格</strong> - 急停</li>
                </ul>
                <h3>游戏机制</h3>
                <ul>
                    <li>碰撞造成伤害，速度越快伤害越高</li>
                    <li>组件品质：灰色(普通) < 绿色(优秀) < 蓝色(稀有) < 紫色(史诗) < 橙色(传说)</li>
                    <li>引擎影响速度，装甲影响血量</li>
                    <li>重量影响加速度和碰撞效果</li>
                </ul>
            </div>
            <button id="help-back-btn" class="menu-btn">返回</button>
        </div>
    </div>

    <!-- 加载界面 -->
    <div id="loading-screen">
        <div class="loading-content">
            <h2>加载中...</h2>
            <div class="loading-bar">
                <div id="loading-progress"></div>
            </div>
        </div>
    </div>

    <!-- 引入库文件 -->
    <script src="js/three.min.js"></script>
    
    <!-- 简化版游戏脚本 -->
    <script src="js/simple-game.js"></script>
</body>
</html>
