<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8"/>
<title>3D 空战 · 极简版</title>
<style>
  body{margin:0;overflow:hidden;font-family:sans-serif;color:#fff}
  #hud{position:absolute;top:10px;left:10px;pointer-events:none;font-size:14px;text-shadow:1px 1px 2px #000}
  #msgBox{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
          background:rgba(0,0,0,.7);padding:20px;border-radius:10px;display:none}
</style>
</head>
<body>
<div id="hud"></div>
<div id="msgBox"></div>
<script src="https://cdn.jsdelivr.net/npm/three@0.155.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/cannon-es@0.20.0/dist/cannon-es.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dat.gui@0.7.9/build/dat.gui.min.js"></script>
<script>
/******************************************************************
 * 1. 全局常量 & 工具
 ******************************************************************/
const KEYS = {};
onkeydown = e => KEYS[e.code] = true;
onkeyup   = e => KEYS[e.code] = false;

const HUD = document.getElementById('hud');
const MSG = document.getElementById('msgBox');
function say(text, sec=3){
  MSG.style.display='block';
  MSG.innerHTML = text;
  setTimeout(()=>MSG.style.display='none', sec*1000);
}

/******************************************************************
 * 2. 初始化 Three 场景
 ******************************************************************/
const scene    = new THREE.Scene();
scene.background = new THREE.Color(0x000510);
const camera   = new THREE.PerspectiveCamera(75,innerWidth/innerHeight,0.1,2000);
const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);

// 环境 & 方向光
scene.add(new THREE.AmbientLight(0xffffff,0.4));
const dirLight = new THREE.DirectionalLight(0xffffff,1);
dirLight.position.set(1,1,1);
scene.add(dirLight);

// 星空背景（1000 个小点）
const starGeo = new THREE.BufferGeometry();
const starPos = [];
for(let i=0;i<1000;i++){
  starPos.push((Math.random()-0.5)*2000,(Math.random()-0.5)*2000,(Math.random()-0.5)*2000);
}
starGeo.setAttribute('position', new THREE.Float32BufferAttribute(starPos,3));
scene.add(new THREE.Points(starGeo,new THREE.PointsMaterial({color:0xaaaaff,size:0.7})));

/******************************************************************
 * 3. 初始化物理世界
 ******************************************************************/
const world = new CANNON.World();
world.gravity.set(0,0,0); // 太空失重
world.broadphase = new CANNON.NaiveBroadphase();

/******************************************************************
 * 4. 玩家战机
 ******************************************************************/
class Player {
  constructor(){
    // 图形
    const group = new THREE.Group();
    const body  = new THREE.Mesh(
      new THREE.BoxGeometry(2,0.5,4),
      new THREE.MeshPhongMaterial({color:0x00eeff})
    );
    body.rotation.x = -Math.PI/2;
    group.add(body);
    this.wingL = new THREE.Mesh(
      new THREE.BoxGeometry(4,0.1,1),
      new THREE.MeshPhongMaterial({color:0x0088ff})
    );
    this.wingL.position.set(-1,0,0);
    group.add(this.wingL);
    this.wingR = this.wingL.clone();
    this.wingR.position.x = 1;
    group.add(this.wingR);
    scene.add(group);
    this.mesh = group;

    // 物理
    this.shape = new CANNON.Box(new CANNON.Vec3(2,0.5,2));
    this.body  = new CANNON.Body({mass:1});
    this.body.addShape(this.shape);
    world.addBody(this.body);

    // 属性
    this.hp = this.maxHp = 100;
    this.shield = 0;  // 额外护盾
    this.speed = 40;
    this.bulletCd = 0;
    this.money = 0;
    this.levelWeapon = 1;
    this.levelShield  = 0;
    this.levelEngine  = 0;

    // 相机跟随
    camera.position.set(0,2,-10);
    group.add(camera);
  }
  update(dt){
    // 读取输入
    const force = new CANNON.Vec3();
    if(KEYS['KeyW']) force.z -= 1;
    if(KEYS['KeyS']) force.z += 1;
    if(KEYS['KeyA']) force.x -= 1;
    if(KEYS['KeyD']) force.x += 1;
    if(KEYS['Space']) force.y += 1;
    if(KEYS['ShiftLeft']) force.y -= 1;
    force.normalize().scale(this.speed, force);
    this.body.velocity.vadd(force, this.body.velocity);

    // 旋转
    if(KEYS['ArrowLeft'])  this.body.angularVelocity.y += 1;
    if(KEYS['ArrowRight']) this.body.angularVelocity.y -= 1;
    if(KEYS['ArrowUp'])    this.body.angularVelocity.x += 1;
    if(KEYS['ArrowDown'])  this.body.angularVelocity.x -= 1;
    if(KEYS['KeyQ'])       this.body.angularVelocity.z += 1;
    if(KEYS['KeyE'])       this.body.angularVelocity.z -= 1;

    // 阻尼
    this.body.angularVelocity.scale(0.9, this.body.angularVelocity);

    // 开火
    if((KEYS['KeyJ'] || KEYS['Mouse0']) && this.bulletCd <=0){
      this.fire();
      this.bulletCd = 0.2;
    }
    // 投弹
    if(KEYS['KeyK'] && this.bombCd<=0){
      this.dropBomb();
      this.bombCd = 2;
    }
    if(this.bulletCd>0) this.bulletCd-=dt;
    if(this.bombCd>0)   this.bombCd-=dt;

    // 同步图形
    this.mesh.position.copy(this.body.position);
    this.mesh.quaternion.copy(this.body.quaternion);

    // HUD
    HUD.innerHTML = `
HP: ${this.hp.toFixed(0)}/${this.maxHp} | 护盾: ${this.shield.toFixed(0)} | 晶石: ${this.money}<br>
当前关卡: ${game.level} | 敌机剩余: ${game.enemies.length}<br>
控制: WASD移动 Space上升 Shift下降  Q/E翻滚 ↑↓←→俯仰偏航 J开火 K投弹
`;
  }
  fire(){
    for(let i=0;i<this.levelWeapon;i++){
      const bullet = new Bullet(
        this.mesh.position.clone(),
        this.body.quaternion.vmult(new THREE.Vector3(0,0,-1)),
        100, 10, 0x00ffff
      );
      bullets.push(bullet);
    }
  }
  dropBomb(){
    const bomb = new Bomb(
      this.mesh.position.clone().add(this.body.quaternion.vmult(new THREE.Vector3(0,-1,-3))),
      new THREE.Vector3(0,0,-30)
    );
    bombs.push(bomb);
  }
  takeDamage(n){
    if(this.shield>0){
      this.shield = Math.max(this.shield - n,0);
    }else{
      this.hp -= n;
      if(this.hp<=0) game.gameOver();
    }
  }
}

/******************************************************************
 * 5. 子弹 & 炸弹
 ******************************************************************/
class Bullet {
  constructor(pos, dir, speed, dmg, color=0xff0000){
    this.mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.2,6,6),
      new THREE.MeshBasicMaterial({color})
    );
    this.mesh.position.copy(pos);
    scene.add(this.mesh);

    this.body = new CANNON.Body({
      mass:0.1,
      shape:new CANNON.Sphere(0.2),
      position:new CANNON.Vec3(pos.x,pos.y,pos.z)
    });
    this.body.velocity.set(dir.x*speed, dir.y*speed, dir.z*speed);
    world.addBody(this.body);

    this.dmg = dmg;
    this.life = 3;
  }
  update(dt){
    this.mesh.position.copy(this.body.position);
    this.life -= dt;
    if(this.life<=0) this.dead=true;
  }
  destroy(){
    scene.remove(this.mesh);
    world.removeBody(this.body);
  }
}
class Bomb {
  constructor(pos, vel){
    this.mesh = new THREE.Mesh(
      new THREE.SphereGeometry(0.5,8,8),
      new THREE.MeshBasicMaterial({color:0xffaa00})
    );
    this.mesh.position.copy(pos);
    scene.add(this.mesh);

    this.body = new CANNON.Body({
      mass:2,
      shape:new CANNON.Sphere(0.5),
      position:new CANNON.Vec3(pos.x,pos.y,pos.z)
    });
    this.body.velocity.set(vel.x,vel.y,vel.z);
    world.addBody(this.body);

    this.life = 5;
  }
  update(dt){
    this.mesh.position.copy(this.body.position);
    this.life -= dt;
    if(this.life<=0){
      // 爆炸
      new Explosion(this.mesh.position);
      this.dead=true;
    }
  }
  destroy(){
    scene.remove(this.mesh);
    world.removeBody(this.body);
  }
}
class Explosion {
  constructor(pos){
    this.mesh = new THREE.Mesh(
      new THREE.SphereGeometry(3,16,16),
      new THREE.MeshBasicMaterial({color:0xff4400,transparent:true,opacity:1})
    );
    this.mesh.position.copy(pos);
    scene.add(this.mesh);
    this.ttl = 0.3;
    // 伤害判定
    game.enemies.forEach(e=>{
      if(e.body.position.distanceTo(new CANNON.Vec3(pos.x,pos.y,pos.z))<5){
        e.takeDamage(50);
      }
    });
  }
  update(dt){
    this.ttl -= dt;
    this.mesh.scale.multiplyScalar(1+dt*3);
    this.mesh.material.opacity = this.ttl/0.3;
    if(this.ttl<=0){scene.remove(this.mesh);this.dead=true;}
  }
}

/******************************************************************
 * 6. 敌人
 ******************************************************************/
class Enemy {
  constructor(difficulty=1){
    const group = new THREE.Group();
    const body = new THREE.Mesh(
      new THREE.BoxGeometry(2,0.5,3),
      new THREE.MeshPhongMaterial({color:0xff0000})
    );
    body.rotation.x = -Math.PI/2;
    group.add(body);
    scene.add(group);
    this.mesh = group;

    this.body = new CANNON.Body({mass:1});
    this.body.addShape(new CANNON.Box(new CANNON.Vec3(2,0.5,2)));
    const r = 200 + Math.random()*300;
    const theta = Math.random()*Math.PI*2;
    this.body.position.set(Math.cos(theta)*r, (Math.random()-0.5)*100, Math.sin(theta)*r);
    world.addBody(this.body);

    this.difficulty = difficulty;
    this.hp = 20 + difficulty*10;
    this.speed = 10 + difficulty*5;
    this.fireCd = 0;
  }
  update(dt, target){
    // 简单 AI：朝玩家转向 & 开火
    const dir = target.clone().vsub(this.body.position).normalize();
    this.body.quaternion.slerp(new CANNON.Quaternion().setFromUnitVectors(new CANNON.Vec3(0,0,1), dir), 0.05);
    this.body.velocity.copy(dir.scale(this.speed));

    if(this.fireCd<=0){
      const b = new Bullet(
        new THREE.Vector3().copy(this.body.position),
        new THREE.Vector3().copy(dir),
        60, 5, 0xff0000
      );
      enemyBullets.push(b);
      this.fireCd = 1+Math.random();
    }
    this.fireCd -= dt;

    this.mesh.position.copy(this.body.position);
    this.mesh.quaternion.copy(this.body.quaternion);

    if(this.hp<=0){
      // 掉落晶石
      const crystal = new Crystal(this.body.position.clone());
      crystals.push(crystal);
      this.dead=true;
    }
  }
  takeDamage(n){
    this.hp -= n;
  }
  destroy(){
    scene.remove(this.mesh);
    world.removeBody(this.body);
  }
}
class Crystal {
  constructor(pos){
    this.mesh = new THREE.Mesh(
      new THREE.OctahedronGeometry(1),
      new THREE.MeshPhongMaterial({color:0x00ff00,emissive:0x00ff00})
    );
    this.mesh.position.copy(pos);
    scene.add(this.mesh);
    this.body = new CANNON.Body({
      mass:1,
      shape:new CANNON.Sphere(1),
      position:new CANNON.Vec3(pos.x,pos.y,pos.z)
    });
    world.addBody(this.body);
    this.life = 20;
  }
  update(dt){
    this.mesh.rotation.y += dt*2;
    this.life -= dt;
    this.mesh.position.copy(this.body.position);
    if(this.life<=0) this.dead=true;
  }
  destroy(){
    scene.remove(this.mesh);
    world.removeBody(this.body);
  }
}

/******************************************************************
 * 7. 游戏主状态机
 ******************************************************************/
class Game {
  constructor(){
    this.state = 'MainMenu'; // MainMenu | Hangar | Battle | GameOver
    this.level = 1;
    this.player = new Player();
    this.enemies = [];
    this.spawnTimer = 0;
    this.gui = new dat.GUI({width:300});
    this.buildGui();
    this.switchState('MainMenu');
  }
  buildGui(){
    this.gui.domElement.style.display='none';
    const f1 = this.gui.addFolder('升级商店');
    f1.add(this.player,'levelWeapon',1,5,1).name('武器等级 (100晶/级)').listen();
    f1.add(this.player,'levelShield',0,5,1).name('护盾等级 (100晶/级)').listen();
    f1.add(this.player,'levelEngine',0,5,1).name('引擎等级 (100晶/级)').listen();
    f1.add({购买:()=>this.upgrade()},'购买');
    f1.add({开始战斗:()=>this.switchState('Battle')},'开始战斗');
    f1.open();
  }
  upgrade(){
    const costs = [0,100,200,300,400,500];
    const tryUpgrade = (prop)=>{
      const lvl = this.player[prop];
      if(lvl<5 && this.player.money>=costs[lvl+1]){
        this.player.money -= costs[lvl+1];
        this.player[prop]++;
        if(prop==='levelShield') this.player.shield += 20;
        if(prop==='levelEngine') this.player.speed += 10;
      }
    };
    tryUpgrade('levelWeapon');
    tryUpgrade('levelShield');
    tryUpgrade('levelEngine');
  }
  switchState(to){
    this.state = to;
    if(to==='MainMenu'){
      say('按空格进入机库',99);
      onkeyup = (e)=>{
        if(e.code==='Space') this.switchState('Hangar');
      };
    }else if(to==='Hangar'){
      this.gui.domElement.style.display='block';
      say('欢迎来到机库！升级后点击“开始战斗”',5);
    }else if(to==='Battle'){
      this.gui.domElement.style.display='none';
      bullets.length = enemyBullets.length = bombs.length = crystals.length = 0;
      this.enemies.length = 0;
      this.spawnTimer = 0;
      // 重置玩家位置
      this.player.body.position.set(0,0,0);
      this.player.body.velocity.set(0,0,0);
      say(`第 ${this.level} 关开始！消灭所有敌机`,3);
    }else if(to==='GameOver'){
      say('GAME OVER！按 R 重新开始',99);
      onkeyup = (e)=>{
        if(e.code==='KeyR') location.reload();
      };
    }
  }
  update(dt){
    if(this.state==='Battle'){
      // 刷怪
      this.spawnTimer += dt;
      if(this.enemies.length<10 && this.spawnTimer>1){
        this.enemies.push(new Enemy(this.level));
        this.spawnTimer = 0;
      }
      // 更新
      this.player.update(dt);
      [bullets,enemyBullets,bombs,crystals,this.enemies].forEach(arr=>{
        arr.forEach(o=>o.update?.(dt));
      });
      // 碰撞检测
      bullets.forEach(b=>{
        this.enemies.forEach(e=>{
          if(b.body.position.distanceTo(e.body.position)<3){
            e.takeDamage(b.dmg);
            b.dead=true;
          }
        });
      });
      enemyBullets.forEach(b=>{
        if(b.body.position.distanceTo(this.player.body.position)<2){
          this.player.takeDamage(b.dmg);
          b.dead=true;
        }
      });
      crystals.forEach(c=>{
        if(c.body.position.distanceTo(this.player.body.position)<3){
          this.player.money += 10;
          c.dead=true;
        }
      });
      // 清理 dead
      [bullets,enemyBullets,bombs,crystals,this.enemies].forEach(arr=>{
        for(let i=arr.length-1;i>=0;i--){
          if(arr[i].dead){arr[i].destroy();arr.splice(i,1);}
        }
      });
      // 关卡完成
      if(this.enemies.length===0){
        this.level++;
        this.switchState('Hangar');
      }
    }
  }
}

const bullets = [];
const enemyBullets = [];
const bombs = [];
const crystals = [];
const game = new Game();

/******************************************************************
 * 8. 主循环
 ******************************************************************/
let last = performance.now();
function animate(){
  requestAnimationFrame(animate);
  const now = performance.now();
  const dt = (now-last)/1000;
  last = now;
  world.step(1/60);
  game.update(dt);
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
