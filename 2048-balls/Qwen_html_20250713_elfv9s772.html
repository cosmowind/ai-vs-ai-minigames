<!DOCTYPE html>
<html>
<body>
<canvas id="gameCanvas"></canvas>
<script src="https://cdn.jsdelivr.net/npm/matter-js @0.19.0/build/matter.min.js"></script>
<script>
// 初始化物理引擎
const { Engine, Render, World, Bodies, Body, Events, Vector } = Matter;
const engine = Engine.create();
const canvas = document.getElementById('gameCanvas');
const render = Render.create({
    canvas: canvas,
    engine: engine,
    options: {
        width: 800,
        height: 600,
        wireframes: false,
        background: '#f0f0f0'
    }
});

// 创建边界
const boundaries = [
    Bodies.rectangle(400, 600, 800, 40, { isStatic: true }), // 底部
    Bodies.rectangle(0, 300, 40, 600, { isStatic: true }),   // 左侧
    Bodies.rectangle(800, 300, 40, 600, { isStatic: true })   // 右侧
];

// 颜色映射表（HSL颜色）
function getColor(power) {
    const hue = (power * 30) % 360;
    return `hsl(${hue}, 70%, 50%)`;
}

// 小球类
class GameBall {
    constructor(x, y, power) {
        this.power = power;
        this.value = 2 ** power;
        this.radius = 15 + power * 5;
        this.body = Bodies.circle(x, y, this.radius, {
            restitution: 0.8,
            friction: 0.05,
            render: {
                fillStyle: getColor(power),
                strokeStyle: '#333',
                lineWidth: 2
            }
        });
        this.body.gameBall = this; // 保存引用
    }

    merge() {
        // 销毁当前物体
        World.remove(engine.world, this.body);
    }

    static create(x, y, power) {
        return new GameBall(x, y, power);
    }
}

// 生成随机球
function spawnRandomBall() {
    const currentPowers = balls.map(b => b.power);
    const minPower = Math.min(...currentPowers);
    const maxPower = Math.max(...currentPowers);
    const limitPower = maxPower >= 2 ? maxPower - 2 : 0;
    
    // 计算生成范围
    const spawnMin = minPower;
    const spawnMax = Math.min(maxPower, limitPower + 2);
    
    // 随机选择power值
    const newPower = Math.floor(Math.random() * (spawnMax - spawnMin + 1)) + spawnMin;
    
    // 玩家选择生成位置（示例：随机x位置）
    const spawnX = Math.random() * 600 + 100;
    const newBall = GameBall.create(spawnX, 0, newPower);
    balls.push(newBall);
    World.add(engine.world, newBall.body);
}

// 碰撞检测逻辑
Events.on(engine, 'collisionStart', function(event) {
    const pairs = event.pairs;
    pairs.forEach(pair => {
        const [a, b] = [pair.bodyA.gameBall, pair.bodyB.gameBall];
        if (a && b && a.power === b.power && !a.merging && !b.merging) {
            // 创建新球
            const newPower = a.power + 1;
            if (newPower <= 20) { // 最大2^20
                const position = Vector.add(a.body.position, b.body.position);
                const newPos = Vector.div(position, 2);
                
                // 移除旧球
                a.merging = true;
                b.merging = true;
                
                setTimeout(() => {
                    a.merge();
                    b.merge();
                    const newBall = GameBall.create(newPos.x, newPos.y, newPower);
                    balls.push(newBall);
                    World.add(engine.world, newBall.body);
                    
                    // 检查胜利条件
                    if (newPower === 20) {
                        alert('恭喜！你合成了2^20！');
                        Engine.stop(engine);
                    }
                }, 100);
            }
        }
    });
});

// 游戏初始化
let balls = [];
function init() {
    // 初始生成两个2^2球
    balls = [
        GameBall.create(200, 500, 2),
        GameBall.create(300, 500, 2)
    ];
    World.add(engine.world, [boundaries, ...balls.map(b => b.body)]);
    
    // 开始游戏循环
    Engine.run(engine);
    Render.run(render);
    
    // 定期生成新球（模拟玩家操作）
    setInterval(spawnRandomBall, 3000);
}

// 启动游戏
init();
</script>
</body>
</html>
